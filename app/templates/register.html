{% extends "base.html" %}

{% block title %}Registrarse - BookSmart{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>📚</h1>
        <h2>Crear Cuenta</h2>
        <p class="auth-subtitle">Únete a BookSmart</p>
        
        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Mínimo 3 caracteres"
                       value="{{ request.form.username if request.form }}">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Mínimo 4 caracteres">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirmar Contraseña:</label>
                <input type="password" id="confirm_password" name="confirm_password" required 
                       placeholder="Repite tu contraseña">
            </div>
            
            <button type="submit" class="btn-auth btn-register">
                Crear Cuenta
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Iniciar Sesión - BookSmart{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>📚</h1>
        <h2>Iniciar Sesión</h2>
        <p class="auth-subtitle">Accede a tu cuenta de BookSmart</p>
        
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Tu nombre de usuario"
                       value="{{ request.form.username if request.form }}">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Tu contraseña">
            </div>
            
            <button type="submit" class="btn-auth btn-login">🎯 Entrar a BookSmart</button>
        </form>
    </div>
</div>
{% endblock %}

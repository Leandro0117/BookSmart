{% extends "base.html" %}

{% block title %}Iniciar Sesión - BookSmart{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-header">
            <div class="auth-logo">
                <img src="{{ url_for('static', filename='images/logo_booksmart.png') }}" alt="BookSmart Logo" class="auth-logo-img">
            </div>
            <h2>Iniciar Sesión</h2>
            <p class="auth-subtitle">Accede a tu cuenta de BookSmart</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">👤 Usuario</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Tu nombre de usuario"
                       value="{{ request.form.username if request.form }}"
                       class="form-input">
            </div>
            
            <div class="form-group">
                <label for="password">🔒 Contraseña</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Tu contraseña"
                       class="form-input">
            </div>
            
            <button type="submit" class="btn-auth btn-primary">
                <span class="btn-icon">🎯</span>
                Entrar a BookSmart
            </button>
        </form>

        <div class="auth-footer">
            <p>¿No tienes cuenta? 
                <a href="{{ url_for('auth.register') }}" class="auth-link">Regístrate aquí</a>
            </p>
            
            <div class="demo-info">
                <p><strong>Cuenta de demostración:</strong><br>
                <code>demo</code> / <code>demo123</code></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
